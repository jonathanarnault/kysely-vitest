name: "Publish"

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Fine-grained token of a main ruleset bypass actor, to push the version bump
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package versions from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: make version-bump VERSION="${TAG#v}"

      - name: Push version bump to main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- package.json packages/*/package.json; then
            echo "Package versions already match $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/*/package.json
          git commit --message "Bump version to ${TAG#v}"
          bump="$(git rev-parse HEAD)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git checkout --quiet "$bump"

      - name: Install npm with staged publishing support
        run: npm install -g npm@^11.20.0

      - name: Build
        run: make build

      # pnpm pack rewrites workspace:^ ranges; npm handles the OIDC exchange
      - name: Pack packages
        run: |
          mkdir -p tarballs
          for pkg in core postgres; do
            pnpm --filter "@kysely-vitest/$pkg" pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          done

      - name: Stage packages on npm
        run: |
          for tarball in ./tarballs/*.tgz; do
            npm stage publish "$tarball" --access public --provenance
          done
